<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris' Ice Cream & Mexican Food — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;700&family=Open+Sans:wght@600;700&family=Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1E4;
    --logo-bg:#ECE9E0;
    --ink:#1c1815;
    --ink-soft:#5b5148;
    --maroon:#7C1F3B;
    --maroon-dark:#4F1226;
    --pine:#2F6B3F;
    --gold:#C98A22;
    --chili:#B7351F;
    --heart:#BE5169;
    --line:#c9bd9f;
    --line-soft:#ddd3ba;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  }
  body{
    margin:0;
    background:#dfd6bd;
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{max-width:1220px; margin:0 auto; padding:24px 18px 60px;}

  /* ---------- masthead: logo-led header ---------- */
  .masthead{
    background:var(--paper);
    border-bottom:4px solid var(--logo-rule);
    padding:34px 18px 26px;
    text-align:center;
  }
  .masthead-inner{max-width:760px; margin:0 auto;}
  .masthead-tagline{margin:14px 0 0; font-family:'Open Sans','Karla',sans-serif; font-weight:600; font-size:.95rem; color:var(--ink);}
  .phone-cta{
    display:inline-flex; flex-direction:column; align-items:center;
    margin-top:20px; padding:12px 30px;
    background:var(--maroon); color:#fff; text-decoration:none;
    border-radius:6px; box-shadow:0 4px 12px rgba(124,31,59,.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .phone-cta:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(124,31,59,.32);}
  .phone-cta-label{font-family:'Oswald',sans-serif; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; opacity:.85;}
  .phone-cta-number{font-family:'Karla',sans-serif; font-weight:800; font-size:1.45rem; letter-spacing:.02em; margin-top:2px;}
  .masthead-meta{
    margin-top:18px;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 20px;
    font-family:'Oswald',sans-serif; font-size:.78rem; letter-spacing:.03em; color:#3b342c;
  }
  .masthead-meta a{text-decoration:none;}
  .masthead-meta a:hover span{border-bottom:1px solid rgba(59,52,44,.45);}
  .meta-item{display:inline-flex; align-items:center; gap:.4em;}
  .meta-icon{width:1.05em; height:1.05em; flex:0 0 auto; fill:none; stroke:var(--maroon); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .lang-toggle{display:inline-flex; border:1.5px solid var(--maroon); border-radius:999px; overflow:hidden; margin-top:18px;}
  .lang-toggle button{font-family:'Oswald',sans-serif; font-size:.74rem; letter-spacing:.08em; font-weight:600; padding:6px 16px; background:transparent; border:none; color:var(--maroon); cursor:pointer;}
  .lang-toggle button[aria-pressed="true"]{background:var(--maroon); color:#fff;}
  .lang-toggle button:focus-visible{outline:2px solid var(--pine); outline-offset:-2px;}

  .reference-note{
    background:#f2e4c8;
    border-bottom:1px solid var(--line);
    padding:9px 18px;
    text-align:center;
    font-size:.84rem;
    color:#5a4a30;
  }

  nav.menu-nav{
    position:sticky; top:0; z-index:5;
    background:#dfd6bd; border-bottom:1px solid var(--line);
    padding:8px 12px; overflow-x:auto; white-space:nowrap;
    display:flex; gap:6px; justify-content:center;
  }
  nav.menu-nav a{
    text-decoration:none; font-family:'Oswald',sans-serif; font-size:.74rem;
    letter-spacing:.05em; font-weight:600; color:#4a4238;
    padding:5px 10px; border-radius:999px; border:1px solid transparent;
    flex:0 0 auto;
  }
  nav.menu-nav a:hover, nav.menu-nav a:focus-visible{color:var(--maroon); border-color:var(--line); background:var(--paper);}

  .sheet{
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 10px 26px rgba(28,24,21,.14);
    margin:26px auto;
    position:relative;
    opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .sheet.in-view{opacity:1; transform:translateY(0);}
  .tape{position:absolute; width:90px; height:28px; top:-12px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.22)); border:1px solid rgba(255,255,255,.6); box-shadow:0 2px 6px rgba(0,0,0,.12); opacity:.7;}
  .tape.l{left:18px; transform:rotate(-6deg);}
  .tape.r{right:18px; transform:rotate(5deg);}
  @media(max-width:640px){.tape{display:none;}}

  .sheet-header{padding:26px 22px 12px; text-align:center;}

  /* ---------- recreated brand lockup (vector, matches the printed logo) ---------- */
  :root{ --logo-red:#B12A4A; --logo-green:#2E8B57; --logo-rule:#B23A55; --heart:#C8355F; }
  .brand-lockup{display:inline-flex; align-items:flex-end; line-height:1; font-size:clamp(2.2rem, 7.5vw, 4rem); white-space:nowrap;}
  .chris-word{
    position:relative; display:inline-flex; align-items:baseline;
    font-family:'Gelasio', Georgia, 'Times New Roman', serif; font-weight:700; font-size:1em;
    color:var(--ink); padding:.16em .05em .14em; line-height:1; letter-spacing:-.01em;
  }
  .chris-word::before, .chris-word::after{
    content:""; position:absolute; left:0; right:0; height:0;
    border-top:.022em solid var(--logo-rule); box-shadow:0 .06em 0 0 var(--logo-rule);
  }
  .chris-word::before{top:.15em;}
  .chris-word::after{bottom:.09em;}
  .icon-slot{position:relative; display:inline-block; width:.5em; height:1em; vertical-align:baseline;}
  .icon-slot svg{position:absolute; bottom:0; left:50%; transform:translateX(-50%); height:1.33em; width:auto; overflow:visible;}
  .right-block{display:flex; flex-direction:column; align-items:flex-start; margin-left:.42em; padding-bottom:.14em;}
  .word-icecream{font-family:'Gelasio', Georgia, 'Times New Roman', serif; font-weight:400; font-size:.85em; color:var(--ink); line-height:1; letter-spacing:.005em;}
  .brand-line2{font-family:'Open Sans', 'Karla', sans-serif; font-weight:700; font-size:.47em; line-height:1; margin-top:.22em; letter-spacing:.01em;}
  .brand-line2 .mex{color:var(--logo-red);}
  .brand-line2 .food{color:var(--logo-green);}
  .sheet-sub{margin:10px 0 0; font-size:.86rem; font-style:italic; color:var(--ink-soft);}
  .rule-double{height:0; border-top:2px solid var(--maroon); border-bottom:2px solid var(--maroon); margin:14px 22px 0;}
  .sheet-top-rule{margin:24px 22px 0;}

  .sheet-body{
    padding:20px 22px 8px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 40px;
  }
  @media(max-width:700px){
    .sheet-body{grid-template-columns:1fr;}
  }
  .col > .food-group + .food-group{margin-top:26px;}

  .food-group, #icecream, #smoothies{scroll-margin-top:64px;}
  .food-group h2{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:1.18rem;
    letter-spacing:.04em; text-align:center;
    margin:0 0 4px; padding-bottom:6px;
    border-bottom:1px solid var(--ink);
  }

  .dish{margin-top:14px;}
  .dish:first-of-type{margin-top:12px;}
  .dish-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-family:'Karla',sans-serif; font-weight:700; font-size:.98rem;}
  .dish-row .price{font-weight:700; color:var(--maroon-dark); white-space:nowrap;}
  .dish p.desc{margin:3px 0 0; font-size:.85rem; color:var(--ink-soft); line-height:1.4;}
  .badge-spicy{color:var(--chili); margin-left:3px;}
  .badge-veg{color:var(--pine); margin-left:3px;}

  .enchilada-prices{display:flex; justify-content:space-around; font-family:'Karla',sans-serif; font-weight:700; font-size:1rem; margin-top:10px;}
  .enchilada-prices span.price{color:var(--maroon-dark);}
  .addon-note{margin-top:8px; font-size:.85rem; color:var(--ink-soft); font-style:italic; text-align:center;}

  .sheet-footer{
    margin-top:10px; padding:12px 22px 20px;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 22px;
    font-family:'Oswald',sans-serif; font-size:.74rem; letter-spacing:.03em; color:var(--ink-soft);
    border-top:1px solid var(--line-soft);
  }
  .sheet-footer a{text-decoration:none; color:inherit; border-bottom:1px dotted var(--ink-soft);}

  .ice-title{text-align:center; font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.08em; font-size:1.05rem; margin:18px 22px 6px;}
  .ice-price-grid{
    max-width:520px; margin:0 auto 22px; padding:0 22px;
    display:grid; grid-auto-flow:column; grid-template-rows:repeat(3,auto); gap:4px 40px;
  }
  .ice-price-grid .row{display:flex; justify-content:space-between; border-bottom:1px dotted var(--line); padding:4px 0; font-size:.92rem;}
  .ice-price-grid .row span:last-child{font-weight:700; color:var(--maroon-dark);}

  .flavor-smoothie-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:26px; padding:6px 22px 26px;}
  @media(max-width:760px){.flavor-smoothie-wrap{grid-template-columns:1fr;}}

  .flavor-board h3{text-align:center; font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.06em; font-size:1.3rem; margin:6px 0 16px;}
  .flavor-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .flavor-tag{
    font-family:'Kalam',cursive; font-weight:700; text-align:center;
    padding:10px 8px; border-radius:3px; color:#fff; font-size:.98rem;
    box-shadow:0 3px 0 rgba(0,0,0,.15), 0 5px 8px rgba(0,0,0,.12);
    transition:transform .18s ease;
  }
  .flavor-tag:nth-child(6n+1){background:#3B5A8A; transform:rotate(-2deg);}
  .flavor-tag:nth-child(6n+2){background:var(--maroon); transform:rotate(1.5deg);}
  .flavor-tag:nth-child(6n+3){background:#6B4A2F; transform:rotate(-1deg);}
  .flavor-tag:nth-child(6n+4){background:var(--pine); transform:rotate(2deg);}
  .flavor-tag:nth-child(6n+5){background:var(--gold); color:#3a2a06; transform:rotate(-2.5deg);}
  .flavor-tag:nth-child(6n+6){background:#2b2b2b; transform:rotate(1deg);}
  .flavor-tag:hover{transform:scale(1.05) rotate(0deg); cursor:default;}

  .smoothie-list h3{text-align:center; font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.06em; font-size:1.05rem; margin:6px 0 14px;}
  .smoothie-card{border-bottom:1px dotted var(--line); padding:8px 0;}
  .smoothie-card:last-child{border-bottom:none;}
  .smoothie-card h4{margin:0 0 3px; font-family:'Oswald',sans-serif; font-weight:600; color:var(--maroon-dark); font-size:.92rem;}
  .smoothie-card p{margin:0; font-size:.8rem; color:var(--ink-soft); line-height:1.4;}

  footer{background:var(--maroon-dark); color:#f3e9df; padding:34px 22px 26px; text-align:center; margin-top:10px;}
  footer h3{font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.06em; font-size:1.3rem; margin:0 0 6px;}
  .contact-grid{display:flex; flex-wrap:wrap; justify-content:center; gap:24px; margin-top:18px; font-size:.92rem;}
  .contact-grid .item{max-width:250px;}
  .contact-grid .label{display:block; font-family:'Oswald',sans-serif; letter-spacing:.08em; font-size:.68rem; color:#d9b9c6; margin-bottom:4px;}
  footer a.phone-link{color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5);}
  .call-note{margin-top:20px; font-size:.82rem; font-style:italic; color:#e3c9d3;}
</style>
</head>

<script>
// ---- Recreated brand mark: heart-topped waffle cone standing in for the apostrophe/"i" ----
let logoInstanceCount = 0;
function heartConeSVG(){
  logoInstanceCount++;
  const pid = "waffle-" + logoInstanceCount;
  return `
<svg viewBox="0 0 176 266" aria-hidden="true">
  <defs>
    <pattern id="${pid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#1c1815"/>
      <rect width="9" height="9" fill="none" stroke="#f4efe4" stroke-width="1.8"/>
    </pattern>
  </defs>
  <path d="M92,34 C98,10 122,-2 146,8 C172,20 182,58 166,88 C158,118 120,146 88,156 C56,146 18,118 8,84 C-6,52 14,8 50,6 C72,4 86,14 92,34 Z" fill="var(--heart)"/>
  <path d="M44,126 L132,126 L88,266 Z" fill="url(#${pid})" stroke="#1c1815" stroke-width="2"/>
</svg>`;
}

function buildBrandLockup(){
  const wrap = el("div","brand-lockup");
  const word = el("span","chris-word");
  word.appendChild(document.createTextNode("CHR"));
  word.appendChild(el("span","icon-slot", heartConeSVG()));
  word.appendChild(document.createTextNode("S’"));
  wrap.appendChild(word);
  const right = el("span","right-block");
  right.appendChild(el("span","word-icecream","ice cream"));
  right.appendChild(el("span","brand-line2",'<span class="mex">MEXICAN</span> <span class="food">FOOD</span>'));
  wrap.appendChild(right);
  return wrap;
}

let lang = "en";

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function renderDish(it){
  const d = el("div","dish");
  const row = el("div","dish-row");
  const nameSpan = document.createElement("span");
  nameSpan.textContent = it.name[lang];
  if(it.spicy) nameSpan.innerHTML += ' <span class="badge-spicy">🌶</span>';
  if(it.veg) nameSpan.innerHTML += ' <span class="badge-veg">🌱</span>';
  row.appendChild(nameSpan);
  row.appendChild(el("span","price", it.price));
  d.appendChild(row);
  if(it.desc && it.desc[lang]){
    d.appendChild(el("p","desc", it.desc[lang]));
  }
  return d;
}

function renderGroup(group){
  const g = el("div","food-group");
  g.id = group.key;
  g.appendChild(el("h2", null, group.title[lang]));

  if(group.special === "enchiladas"){
    const priceRow = el("div","enchilada-prices");
    priceRow.innerHTML = '<span>[3] <span class="price">$11.50</span></span><span>[4] <span class="price">$12.99</span></span>';
    g.appendChild(priceRow);
    const d = el("div","dish");
    d.appendChild(el("p","desc", (lang==="en"
      ? "Steak, Chicken, Pork, or Chorizo — choice of meat, cilantro, lettuce, onions, sour cream, cotija cheese, and green sauce"
      : "Res, Pollo, Cerdo o Chorizo — elección de carne, cilantro, lechuga, cebolla, crema, queso cotija y salsa verde")));
    g.appendChild(d);
    g.appendChild(el("p","addon-note", lang==="en" ? "Add egg +$1.50" : "Agregar huevo +$1.50"));
    return g;
  }

  group.items.forEach(it=> g.appendChild(renderDish(it)));
  return g;
}

function renderNav(){
  const nav = document.getElementById("menu-nav");
  nav.innerHTML = "";
  const items = [
    ...page1.colA, ...page1.colB, ...page2.colA, ...page2.colB,
  ].map(g=>({id:g.key, title:g.title}));
  items.push({id:"icecream", title:T.icecream});
  items.push({id:"smoothies", title:T.smoothies});
  items.forEach(s=>{
    const a = el("a", null, s.title[lang]);
    a.href = "#"+s.id;
    a.addEventListener("click", (ev)=>{
      const target = document.getElementById(s.id);
      if(!target) return;
      ev.preventDefault();
      const navH = document.getElementById("menu-nav").offsetHeight + 12;
      const top = target.getBoundingClientRect().top + window.pageYOffset - navH;
      window.scrollTo({top, behavior:"smooth"});
    });
    nav.appendChild(a);
  });
}

  const container = document.getElementById("sheets");

}

function applyStaticText(){
  document.querySelectorAll("[data-en]").forEach(node=>{
    node.textContent = node.getAttribute(lang === "en" ? "data-en" : "data-es");
  });
  document.documentElement.lang = lang;
  document.getElementById("btn-en").setAttribute("aria-pressed", String(lang==="en"));
  document.getElementById("btn-es").setAttribute("aria-pressed", String(lang==="es"));
}

function observeSheets(){
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("in-view");
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:0.08});
  document.querySelectorAll(".sheet").forEach(s=>obs.observe(s));
}

  const slot = document.getElementById("masthead-logo");

}

function renderAll(){
  applyStaticText();
  renderMastheadLogo();
  renderNav();
  renderSheets();
  observeSheets();
}

document.getElementById("btn-es").addEventListener("click", ()=>{ lang="es"; renderAll(); });
